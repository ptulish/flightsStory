services:
  - type: web
    name: skyhistory-api
    runtime: node
    buildCommand: npm install
    startCommand: npm run start:api
    envVars:
      - key: NODE_ENV
        value: production
      - key: INLINE_WORKER
        value: "false"
      - key: FRONTEND_ORIGIN
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: APP_JWT_SECRET
        generateValue: true
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REDIRECT_URI
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: skyhistory-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: skyhistory-redis
          property: connectionString

  - type: worker
    name: skyhistory-worker
    runtime: node
    buildCommand: npm install
    startCommand: npm run start:worker
    envVars:
      - key: NODE_ENV
        value: production
      - key: FRONTEND_ORIGIN
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: APP_JWT_SECRET
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: skyhistory-postgres
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: skyhistory-redis
          property: connectionString

databases:
  - name: skyhistory-postgres
    databaseName: skyhistory

  - name: skyhistory-redis
    type: redis
